name: CI

# Build, test, and lint on every pull request and on pushes to main.
# Keeps the tree formatted, clippy-clean, and green before release tags are cut.

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  msrv:
    name: MSRV (rust-version from Cargo.toml)
    # Builds with the oldest Rust we promise to support (`rust-version` in the
    # root Cargo.toml), so a dependency that raises its own minimum above ours
    # fails here, the day it lands, instead of breaking someone's source build.
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Read rust-version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Build every shipped feature
        run: cargo check --workspace --all-targets --locked --features zstd-experimental,pdf-ocr,markdown,smart-import,validate,epub34,metadata

  check:
    name: fmt + clippy + test (${{ matrix.arch }})
    # ARM64 as well as x86-64: the SIMD image codecs compile different code per
    # architecture, and an ARM64-only break (archmage 0.9.27 vs the JPEG XL
    # encoder) once got past an x86-only CI.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --locked

      # The experimental Zstd-OCF research track is behind a default-off feature
      # (pure Rust, no C). Build + test it too so it doesn't rot. The C ceiling
      # (`zstd-c-bench`) is intentionally NOT built in CI — it pulls libzstd and
      # is a local dev convenience only.
      - name: Clippy (zstd-experimental + pdf-ocr)
        run: cargo clippy --all-targets --locked --features zstd-experimental,pdf-ocr,markdown,smart-import,validate -- -D warnings

      - name: Test (zstd-experimental + pdf-ocr)
        run: cargo test --all-targets --locked --features zstd-experimental,pdf-ocr,markdown,smart-import,validate
