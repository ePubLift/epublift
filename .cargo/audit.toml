# cargo-audit configuration (read by `cargo audit` and the Audit workflow).
#
# Every ignore below is a known, reviewed advisory with no fix reachable from
# this project yet. Each one names why it is accepted and what removes it; drop
# the entry the moment that happens, so the list never outlives its reason.

[advisories]
ignore = [
    # rsa (via rustls-rustcrypto, the pure-Rust crypto provider of our HTTPS
    # client): the Marvin timing side channel. It leaks an RSA *private* key
    # through decryption/signing timing; we are only ever a TLS client that
    # verifies servers' signatures with public keys, and hold no RSA private
    # key. No fixed rsa release exists; drop this when one does.
    "RUSTSEC-2023-0071",
]
